name: Legal document parser tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/legal-document-parser
  pull_request:
    branches:
      - main
      - feature/legal-document-parser

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile modified source and tests
        run: python -m compileall -q src/document src/training/qa_dataset_audit.py src/evaluation/legal_retrieval_evaluation.py tests
      - name: Run legal source page audit tests
        run: python -m unittest discover -s tests -p "test_legal_source_audit.py" -v
      - name: Run legal parser tests
        run: python -m unittest discover -s tests -p "test_legal_parser.py" -v
      - name: Run legal section assembler tests
        run: python -m unittest discover -s tests -p "test_legal_section_assembler.py" -v
      - name: Run legal validation tests
        run: python -m unittest discover -s tests -p "test_legal_validation.py" -v
      - name: Run legal chunker tests
        run: python -m unittest discover -s tests -p "test_legal_chunker.py" -v
      - name: Run legal document pipeline tests
        run: python -m unittest discover -s tests -p "test_legal_document_pipeline.py" -v
      - name: Run citation-aware context builder tests
        run: python -m unittest discover -s tests -p "test_context_builder.py" -v
      - name: Run legal retriever tests
        run: python -m unittest discover -s tests -p "test_retriever.py" -v
      - name: Run legal QA dataset audit tests
        run: python -m unittest discover -s tests -p "test_qa_dataset_audit.py" -v
      - name: Run legal retrieval evaluation tests
        run: python -m unittest discover -s tests -p "test_legal_retrieval_evaluation.py" -v
