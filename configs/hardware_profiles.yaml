profiles:
  generic_cpu:
    device: cpu
    notes: "Portable CPU baseline"

  nvidia_cuda:
    device: cuda
    notes: "Use when CUDA is available"

  amd_rocm:
    device: cuda
    notes: "PyTorch device is typically reported as cuda when ROCm is correctly configured"

  apple_mps:
    device: mps
    notes: "Use when MPS is available"

  reference_development:
    description: "8 GB RAM Ryzen 5-class laptop baseline"
    preferred_device: cpu
    initial_model_target: "10M parameters"
    context_length: 256
    vocabulary_size: 8000
    notes:
      - "Configuration is a development baseline, not a hard maximum."
      - "Batch size and accumulation are selected from runtime memory measurements."
      - "Larger experiments can use alternate hardware without changing project code."
