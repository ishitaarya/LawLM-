project:
  name: LawSuit LLM
  repository_name: LawLM-
  version: "0.2.0"
  phase: 1
  phases: 7
  description: "Educational from-scratch legal language model and legal document understanding project"

principles:
  from_scratch: true
  pretrained_llm: false
  objective: "Understand and implement the core LLM pipeline under the hood"
  production_target: false
  initial_parameter_target: 10000000

model:
  architecture: "decoder-only Transformer"
  parameters_target: 10000000
  vocabulary_size: 8000
  context_length: 256
  embedding_dim: 384
  layers: 4
  attention_heads: 6
  ffn_dim: 1536
  dropout: 0.1
  initialization: "random"

scaling:
  corpus_targets:
    stage_1: "small experimental corpus"
    stage_2: "medium legal corpus"
    stage_3: "large corpus experiments"
  note: "Corpus size is independent of model parameter count and is processed incrementally."

data_pipeline:
  raw: data/raw
  extracted: data/extracted
  cleaned: data/cleaned
  deduplicated: data/deduplicated
  structured: data/structured
  tokenized: data/tokenized
  train: data/train
  validation: data/validation
  test: data/test

runtime:
  device_selection: "auto"
  batch_size: "hardware-dependent"
  gradient_accumulation: true
  mixed_precision: "auto"
  checkpointing: true
  reproducibility: true

phases:
  phase_1: "Foundation and project architecture"
  phase_2: "Legal corpus collection and preparation"
  phase_3: "Tokenizer from scratch"
  phase_4: "Decoder-only Transformer from scratch"
  phase_5: "Training and experiment framework"
  phase_6: "Generation and legal document understanding"
  phase_7: "Evaluation, enhancement, and research experiments"
